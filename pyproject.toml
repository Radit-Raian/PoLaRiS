[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "polaris-psf"
version = "0.1.0"
description = "PoLaRiS: Point-spread Function Reconstruction of Stellar Sources"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [
    { name = "Radit Raian" },
]
dependencies = [
    "numpy",
    "pandas",
    "matplotlib",
    "scipy",
    "astropy",
    "astroquery",
    "photutils",
]

[project.urls]
Homepage = "https://github.com/Radit-Raian/PoLaRiS"

[tool.setuptools.packages.find]
include = ["polaris*"]
